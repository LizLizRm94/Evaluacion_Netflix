
services:
  hadoop:
    image: apache/hadoop:3.5.0
    container_name: netflix-hadoop
    hostname: localhost
    command:
      - bash
      - -c
      - |
        export HADOOP_HOME=/opt/hadoop
        export HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
        export HADOOP_MAPRED_HOME=/opt/hadoop
        export HADOOP_YARN_HOME=/opt/hadoop
        export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/hadoop/bin:/opt/hadoop/sbin
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then
          hdfs namenode -format -force
        fi
        hdfs namenode &
        sleep 8
        hdfs datanode &
        yarn resourcemanager &
        yarn nodemanager &
        tail -f /dev/null
    ports:
      - "9870:9870"
      - "8088:8088"
      - "9000:9000"
    volumes:
      - hadoop_data:/tmp/hadoop-root
    restart: unless-stopped

volumes:
  hadoop_data:
